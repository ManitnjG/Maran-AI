# OpenCode-powered orchestrator with persistent mission storage.
services:
  api:
    build: ./services/orchestrator
    ports: ["8000:8000"]
    environment:
      MARAN_ACCESS_TOKEN: ${MARAN_ACCESS_TOKEN:?Set MARAN_ACCESS_TOKEN}
      MARAN_ENV: production
      MARAN_STORAGE_MODE: persistent_volume
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      MARAN_OPENCODE_ZEN_MODEL: ${MARAN_OPENCODE_ZEN_MODEL:-}
    volumes: ["maran-data:/data"]
volumes:
  maran-data:
