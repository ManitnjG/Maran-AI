name: Orchestrator CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/orchestrator/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/orchestrator/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/orchestrator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.5
      - name: Run orchestrator tests
        env:
          MARAN_DB_PATH: /tmp/maran-ci.db
          MARAN_WEB_ENABLED: 'false'
        run: pytest -q
