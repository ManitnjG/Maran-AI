name: Build signed Play AAB

on:
  workflow_dispatch:

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Play release secrets
        env:
          MARAN_API_BASE_URL: ${{ secrets.MARAN_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.MARAN_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MARAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MARAN_KEY_PASSWORD }}
        run: |
          test -n "$MARAN_API_BASE_URL"
          case "$MARAN_API_BASE_URL" in https://*) ;; *) echo "MARAN_API_BASE_URL must use HTTPS"; exit 1;; esac
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARAN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/maran-upload.jks"
          test -s "$RUNNER_TEMP/maran-upload.jks"

      - name: Build signed Play bundle
        env:
          MARAN_API_BASE_URL: ${{ secrets.MARAN_API_BASE_URL }}
          MARAN_KEYSTORE_PATH: ${{ runner.temp }}/maran-upload.jks
          MARAN_KEYSTORE_PASSWORD: ${{ secrets.MARAN_KEYSTORE_PASSWORD }}
          MARAN_KEY_ALIAS: ${{ secrets.MARAN_KEY_ALIAS }}
          MARAN_KEY_PASSWORD: ${{ secrets.MARAN_KEY_PASSWORD }}
        run: gradle :app:bundlePlayRelease --stacktrace "-PMARAN_API_BASE_URL=$MARAN_API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: maran-play-signed-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 7
          if-no-files-found: error
