name: Orchestrator CI
on:
  push:
    branches: [ main ]
    paths: ['services/orchestrator/**', '.github/workflows/orchestrator.yml']
  pull_request:
    paths: ['services/orchestrator/**', '.github/workflows/orchestrator.yml']
  workflow_dispatch:
concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    env:
      PYTHONPATH: ${{ github.workspace }}/services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t maran-ci services/orchestrator
      - name: Check authenticated container startup
        run: |
          docker run -d --name maran-ci -p 8000:8000 -e MARAN_ENV=production -e MARAN_ACCESS_TOKEN=ci-only-token-for-container-smoke maran-ci
          curl --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/missions)" = "401"
          curl --fail -H 'Authorization: Bearer ci-only-token-for-container-smoke' http://127.0.0.1:8000/capabilities
      - name: Container diagnostics
        if: failure()
        run: docker logs maran-ci
      - name: Stop container
        if: always()
        run: docker rm -f maran-ci || true
