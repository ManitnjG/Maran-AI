name: Release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.3.0-preview
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug preview
        env:
          MARAN_API_BASE_URL: ${{ secrets.MARAN_API_BASE_URL }}
        run: |
          if [ -n "$MARAN_API_BASE_URL" ]; then
            gradle :app:assembleDebug --stacktrace "-PMARAN_API_BASE_URL=$MARAN_API_BASE_URL"
          else
            gradle :app:assembleDebug --stacktrace
          fi
      - run: cp app/build/outputs/apk/debug/app-debug.apk MARAN-preview.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: MARAN-preview.apk
          prerelease: true
          generate_release_notes: true
