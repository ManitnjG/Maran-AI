name: Release Full APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.10.1-full-preview

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build private Full debug preview
        env:
          MARAN_API_BASE_URL: ${{ secrets.MARAN_API_BASE_URL }}
        run: |
          API_URL="${MARAN_API_BASE_URL:-https://example.invalid/}"
          gradle :app:assembleFullDebug --stacktrace "-PMARAN_API_BASE_URL=$API_URL"
      - run: cp app/build/outputs/apk/full/debug/app-full-debug.apk MARAN-full-preview.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: MARAN-full-preview.apk
          prerelease: true
          generate_release_notes: true
          body: |
            Private Full preview. Do not upload this variant to Google Play.
            It includes optional user-initiated Accessibility screen controls and broader local launcher visibility.
