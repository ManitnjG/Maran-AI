name: Android CI
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          MARAN_API_BASE_URL: ${{ secrets.MARAN_API_BASE_URL }}
        run: |
          if [ -n "$MARAN_API_BASE_URL" ]; then
            gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace "-PMARAN_API_BASE_URL=$MARAN_API_BASE_URL"
          else
            gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: maran-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MARAN 0.9 preview ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Development APK for testing. This is debug-signed, not a production-signed release.
            Premium Assistant, Workers, and Activity interface. Streaming AI chat uses a saved OpenRouter API key. Worker tasks require a configured MARAN server.
            Back up saved work before updating: debug signing keys can differ between CI builds.
